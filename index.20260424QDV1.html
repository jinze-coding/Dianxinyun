// ─── 页面2：人员与安全 ──────────────────────────────
// 身份证号校验（18 位数字或 17 位数字+X）
const ID_CARD_REGEX = /^\d{17}[\dXx]$/;
// 手机号校验
const PHONE_REGEX = /^1[3-9]\d{9}$/;

const EMPTY_FORM = { name: '', gender: '男', idcard: '', phone: '', unit: '', role: '普工', note: '' };

function PagePersonnel({ project, theme: T }) {
  const projectData = DATA_BY_PROJECT[project] || DATA_BY_PROJECT.p1;

  // 人员数据（按项目隔离）
  const [personnel, setPersonnel] = React.useState(() => {
    const saved = localStorage.getItem(`app_personnel_${project}`);
    return saved ? JSON.parse(saved) : projectData.personnel;
  });
  const [trainings, setTrainings] = React.useState(() => {
    const saved = localStorage.getItem(`app_trainings_${project}`);
    return saved ? JSON.parse(saved) : projectData.trainings;
  });
  const [files, setFiles] = React.useState(() => {
    const saved = localStorage.getItem(`app_files_${project}`);
    return saved ? JSON.parse(saved) : projectData.files;
  });

  // 项目切换时重载
  React.useEffect(() => {
    const savedP = localStorage.getItem(`app_personnel_${project}`);
    const savedT = localStorage.getItem(`app_trainings_${project}`);
    const savedF = localStorage.getItem(`app_files_${project}`);
    setPersonnel(savedP ? JSON.parse(savedP) : projectData.personnel);
    setTrainings(savedT ? JSON.parse(savedT) : projectData.trainings);
    setFiles(savedF ? JSON.parse(savedF) : projectData.files);
  }, [project]);

  React.useEffect(() => { localStorage.setItem(`app_personnel_${project}`, JSON.stringify(personnel)); }, [personnel, project]);
  React.useEffect(() => { localStorage.setItem(`app_trainings_${project}`, JSON.stringify(trainings)); }, [trainings, project]);
  React.useEffect(() => { localStorage.setItem(`app_files_${project}`, JSON.stringify(files)); }, [files, project]);

  // 筛选（草稿/应用分离）
  const [draftSearch, setDraftSearch] = React.useState('');
  const [draftStatus, setDraftStatus] = React.useState('全部');
  const [appliedSearch, setAppliedSearch] = React.useState('');
  const [appliedStatus, setAppliedStatus] = React.useState('全部');

  const [showAddModal, setShowAddModal] = React.useState(false);
  const [addForm, setAddForm] = React.useState(EMPTY_FORM);
  const [editingPerson, setEditingPerson] = React.useState(null);
  const [selectedPerson, setSelectedPerson] = React.useState(null);

  const [showTrainingModal, setShowTrainingModal] = React.useState(false);
  const [trainingForm, setTrainingForm] = React.useState({ name: '', eduType: '临时人员安全三级教育', time: '', place: '', trainer: '', personIds: [], note: '' });
  const [trainingRecordView, setTrainingRecordView] = React.useState(null);

  const [fileTypeFilter, setFileTypeFilter] = React.useState('全部');
  const [previewFile, setPreviewFile] = React.useState(null);

  const statusFilters = ['全部', '待教育', '已教育', '已离场'];
  const fileTypes = ['全部', '培训资料', '签字文件', '证书'];

  const filteredPersonnel = personnel.filter(p => {
    const matchStatus = appliedStatus === '全部' || p.status === appliedStatus;
    const matchName = !appliedSearch || p.name.includes(appliedSearch) || p.idcard.includes(appliedSearch);
    return matchStatus && matchName;
  });

  const filteredFiles = fileTypeFilter === '全部' ? files : files.filter(f => f.fileType === fileTypeFilter);

  const eduRate = personnel.length === 0 ? 0 : Math.round((personnel.filter(p => p.status === '已教育').length / personnel.length) * 100);
  const todayNew = personnel.filter(p => p.entryTime?.startsWith('2026-04-24')).length;
  const todayEducated = personnel.filter(p => p.status === '已教育').length;
  const pendingCount = personnel.filter(p => p.status === '待教育').length;

  const handleQueryPersonnel = () => { setAppliedSearch(draftSearch); setAppliedStatus(draftStatus); };
  const handleResetPersonnel = () => { setDraftSearch(''); setDraftStatus('全部'); setAppliedSearch(''); setAppliedStatus('全部'); };

  const handleExportCSV = () => {
    const header = ['姓名', '性别', '身份证号', '手机号', '所属单位', '工种', '入场时间', '状态'];
    const rows = filteredPersonnel.map(p => [p.name, p.gender, p.idcard, p.phone, p.unit, p.role, p.entryTime, p.status]);
    const csv = '﻿' + [header, ...rows].map(r => r.map(c => `"${c ?? ''}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `临时人员_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const validateForm = (f) => {
    if (!f.name?.trim()) return '请填写姓名';
    if (!ID_CARD_REGEX.test(f.idcard)) return '身份证号格式不正确（18位数字，最后一位可为X）';
    if (!PHONE_REGEX.test(f.phone)) return '手机号格式不正确';
    return null;
  };

  const handleAddPerson = () => {
    const err = validateForm(addForm);
    if (err) { alert(err); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const entryTime = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const id = Math.max(0, ...personnel.map(p => p.id)) + 1;
    setPersonnel([...personnel, {
      id, ...addForm, phone: addForm.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'),
      entryTime, status: '待教育',
    }]);
    setAddForm(EMPTY_FORM);
    setShowAddModal(false);
  };

  const handleEditPerson = () => {
    const err = validateForm(editingPerson);
    if (err) { alert(err); return; }
    setPersonnel(personnel.map(p => p.id === editingPerson.id ? editingPerson : p));
    setEditingPerson(null);
  };

  const handleDeletePerson = (p) => {
    if (window.confirm(`确认删除 ${p.name}？此操作不可撤销。`)) {
      setPersonnel(personnel.filter(x => x.id !== p.id));
    }
  };

  const handleCreateTraining = () => {

      status: '进行中', type: trainingForm.eduType,

              }}>查询</button>
              <button onClick={handleResetPersonnel} style={{
                padding: '4px 10px', fontSize: 11, borderRadius: 4, cursor: 'pointer',

            </div>
            <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 10 }}>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {trainings.slice(-2).reverse().map(t => (
                <div key={`t-${t.id}`} style={{ fontSize: 10, color: T.textMuted, lineHeight: 1.4 }}>
                  <span style={{ color: T.accent }}>·</span> {t.time?.split(' ')[0]} 新建《{t.name}》

                <div key={`f-${f.id}`} style={{ fontSize: 10, color: T.textMuted, lineHeight: 1.4 }}>
                  <span style={{ color: T.success }}>·</span> {f.time?.split(' ')[0]} 上传《{f.name}》

            </div>

        />

      {/* 编辑人员弹窗 */}

        <PersonFormModal

      {/* 人员详情弹窗 */}
      {selectedPerson && (
        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)',

            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20 }}>

            </div>
            {[

              ['身份证号', selectedPerson.idcard], ['手机号', selectedPerson.phone],
              ['所属单位', selectedPerson.unit], ['工种', selectedPerson.role],
              ['入场时间', selectedPerson.entryTime], ['备注', selectedPerson.note || '—'],
            ].map(([k, v]) => (
              <div key={k} style={{ display: 'flex', padding: '7px 0', borderBottom: `1px solid ${T.borderColor}` }}>
                <span style={{ width: 80, fontSize: 12, color: T.textMuted }}>{k}</span>
                <span style={{ fontSize: 12, color: T.textPrimary, flex: 1 }}>{v}</span>

              <button onClick={() => setSelectedPerson(null)} style={{

      {showTrainingModal && (
        <div style={{

          display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000,
        }} onClick={() => setShowTrainingModal(false)}>

              <div><span style={{ color: T.textMuted }}>讲师：</span>{trainingRecordView.trainer}</div>
            </div>
            <div style={{ fontSize: 12, color: T.textMuted, marginBottom: 6 }}>关联人员（{trainingRecordView.personIds.length}）</div>
            <div style={{
              background: T.surface2, borderRadius: 6, padding: 10,
              display: 'flex', flexWrap: 'wrap', gap: 6,

            </div>

                background: T.accent, color: '#fff', cursor: 'pointer', fontSize: 13,
              }}>关闭</button>
            </div>

      {/* 文件预览弹窗 */}

        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000,
        }} onClick={() => setPreviewFile(null)}>
          <div style={{
            background: T.modalBg, border: `1px solid ${T.borderColor}`,
            borderRadius: 12, padding: 20, width: 560, maxWidth: '92vw',
          }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: T.textPrimary }}>{previewFile.name}</span>
              <button onClick={() => setPreviewFile(null)} style={{
                background: 'none', border: 'none', color: T.textMuted, fontSize: 20, cursor: 'pointer',
              }}>×</button>
            </div>
            <div style={{
              background: T.surface2, border: `1px solid ${T.borderColor}`,
              borderRadius: 8, height: 320, display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center', gap: 10,
            }}>
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="1.2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              <div style={{ fontSize: 13, color: T.textPrimary }}>{previewFile.fileType}</div>
              <div style={{ fontSize: 11, color: T.textMuted }}>{previewFile.batchName}</div>
              <div style={{ fontSize: 10, color: T.textMuted, marginTop: 10 }}>文件预览占位 · 实际集成后此处显示 PDF/图片内容</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

      <div style={{ fontSize: 12, color: T.textSecondary, marginBottom: 5 }}>{label}</div>
      {children}
    </div>

}

const fieldInput = (T) => ({
  width: '100%', background: T.surface2, border: `1px solid ${T.borderColor}`,
  borderRadius: 6, padding: '7px 10px', fontSize: 12, color: T.textPrimary, outline: 'none',
  boxSizing: 'border-box',
});

// ─── 页面3：设备与监控 ──────────────────────────────
function CameraCell({ cam, theme: T, size, fullscreen, onClick }) {
  const [hovered, setHovered] = React.useState(false);
  const camIdNum = typeof cam.id === 'number' ? cam.id : 1;
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onClick={onClick}
      style={{
        background: '#060e1c', border: `1px solid ${hovered ? T.accent : T.borderColor}`,
        borderRadius: 5, overflow: 'hidden', position: 'relative',
        ...(fullscreen ? { width: '100%', height: '100%' } : { aspectRatio: '16/9' }),
        transition: 'border-color 0.2s', cursor: 'pointer',
      }}
    >
      {cam.online ? (
        <div style={{
          width: '100%', height: '100%',
          background: `linear-gradient(${135 + camIdNum * 17}deg, #060e1c 0%, #0d1f35 50%, #071a2c 100%)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          {size !== 'tiny' && (
            <svg width={fullscreen ? 64 : 20} height={fullscreen ? 64 : 20} viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="1.5" opacity={fullscreen ? 0.35 : 0.25}>
              <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.889L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
            </svg>
          )}
        </div>
      ) : (
        <div style={{
          width: '100%', height: '100%', background: '#08111e',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <span style={{ fontSize: size === 'tiny' ? 8 : fullscreen ? 18 : 10, color: '#333' }}>离线</span>
        </div>
      )}
      {cam.online && (
        <div style={{
          position: 'absolute', top: fullscreen ? 10 : 4, left: fullscreen ? 10 : 4,
          display: 'flex', alignItems: 'center', gap: 3,
          background: 'rgba(0,0,0,0.55)', padding: fullscreen ? '3px 8px' : '1px 5px', borderRadius: 2,
        }}>
          <span style={{ width: fullscreen ? 6 : 4, height: fullscreen ? 6 : 4, borderRadius: '50%', background: T.success, display: 'block', flexShrink: 0 }}></span>
          {size !== 'tiny' && <span style={{ fontSize: fullscreen ? 11 : 9, color: '#fff' }}>LIVE</span>}
        </div>
      )}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        background: 'linear-gradient(transparent, rgba(0,0,0,0.75))',
        padding: fullscreen ? '12px 12px 8px' : size === 'tiny' ? '4px 4px 2px' : '8px 6px 3px',
        fontSize: fullscreen ? 13 : size === 'tiny' ? 9 : 10, color: 'rgba(255,255,255,0.75)',
        display: 'flex', justifyContent: 'space-between',
      }}>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{cam.name} · {cam.area}</span>
        {size !== 'tiny' && <span style={{ color: 'rgba(255,255,255,0.4)', flexShrink: 0 }}>#{cam.id}</span>}
      </div>
    </div>
  );
}

function PageMonitor({ project, theme: T }) {
  const projectData = DATA_BY_PROJECT[project] || DATA_BY_PROJECT.p1;
  const ALL_CAMERAS = projectData.cameras;

  const [layout, setLayout] = React.useState(8);
  const [selectedDevice, setSelectedDevice] = React.useState(null);
  const [camListFilter, setCamListFilter] = React.useState('全部');
  const [fullscreenCam, setFullscreenCam] = React.useState(null);
  const [refreshTick, setRefreshTick] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const [deviceStatusFilter, setDeviceStatusFilter] = React.useState('全部');
  const [devices, setDevices] = React.useState(projectData.devices);

  // 项目切换：重置状态 + 重载设备
  React.useEffect(() => {
    setDevices(projectData.devices);
    setSelectedDevice(null);
    setFullscreenCam(null);
    setCamListFilter('全部');
    setDeviceStatusFilter('全部');
    // 若当前布局超过项目摄像头数，降级
    if (layout > projectData.cameras.length && projectData.cameras.length > 0) {
      const fallback = [1, 4, 8, 16].find(n => n <= projectData.cameras.length) || 1;
      setLayout(fallback);
    }
  }, [project]);

  // 单屏/4/8/16（8 宫格 4×2）
  const layoutOptions = [
    { n: 1, label: '单屏' },
    { n: 4, label: '4宫格' },
    { n: 8, label: '8窗口' },
    { n: 16, label: '16窗口' },
  ];

  const gridConfig = {
    1: { cols: 1, rows: 1 },
    4: { cols: 2, rows: 2 },
    8: { cols: 4, rows: 2 },
    16: { cols: 4, rows: 4 },
  };
  const { cols, rows } = gridConfig[layout] || gridConfig[4];
  const displayCams = ALL_CAMERAS.slice(0, layout);

  const onlineCount = ALL_CAMERAS.filter(c => c.online).length;
  const offlineCount = ALL_CAMERAS.length - onlineCount;

  const summary = {
    total: devices.length,
    running: devices.filter(d => d.status === '运行中').length,
    abnormal: devices.filter(d => d.status === '异常').length,
    stopped: devices.filter(d => d.status === '停机').length,
    towerCranes: devices.filter(d => d.type === '塔吊').length,
  };

  // 从项目摄像头中动态提取区域
  const areaTags = ['全部', ...Array.from(new Set(ALL_CAMERAS.map(c => c.area)))];
  const filteredListCams = camListFilter === '全部' ? ALL_CAMERAS : ALL_CAMERAS.filter(c => c.area === camListFilter);

  // 设备列表筛选
  const filteredDevices = deviceStatusFilter === '全部' ? devices : devices.filter(d => d.status === deviceStatusFilter);

  const handleRefresh = () => {
    setRefreshing(true);
    setRefreshTick(t => t + 1);
    setTimeout(() => setRefreshing(false), 600);
  };

  const handleRefreshDevice = (e, dev) => {
    e.stopPropagation();
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const newTime = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    setDevices(devices.map(d => d.id === dev.id ? { ...d, lastReport: newTime } : d));
  };

  return (
    <div style={{ display: 'flex', height: '100%', overflow: 'hidden', gap: 12, padding: 16 }}>
      {/* 左：统计 + 摄像头列表 */}
      <div style={{ width: 220, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 10, overflow: 'hidden' }}>
        <div style={{ background: T.cardBg, border: `1px solid ${T.borderColor}`, borderRadius: T.radius, padding: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary, marginBottom: 12 }}>摄像头概览</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <div style={{ flex: 1, textAlign: 'center', background: T.surface2, borderRadius: 6, padding: '8px 4px' }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.accent }}>{onlineCount}</div>
              <div style={{ fontSize: 10, color: T.textMuted }}>在线</div>
            </div>
            <div style={{ flex: 1, textAlign: 'center', background: T.surface2, borderRadius: 6, padding: '8px 4px' }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.textMuted }}>{offlineCount}</div>
              <div style={{ fontSize: 10, color: T.textMuted }}>离线</div>
            </div>
            <div style={{ flex: 1, textAlign: 'center', background: T.surface2, borderRadius: 6, padding: '8px 4px' }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.textPrimary }}>{ALL_CAMERAS.length}</div>
              <div style={{ fontSize: 10, color: T.textMuted }}>总计</div>
            </div>
          </div>
        </div>

        <div style={{ background: T.cardBg, border: `1px solid ${T.borderColor}`, borderRadius: T.radius, padding: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>设备状态</span>
            <span style={{
              fontSize: 9, padding: '2px 6px', borderRadius: 3,
              background: `${T.accent2}22`, color: T.accent2,
            }}>塔吊 {summary.towerCranes}</span>
          </div>
          {[
            { label: '设备总数', val: summary.total, color: T.textPrimary, filter: '全部' },
            { label: '运行中', val: summary.running, color: T.success, filter: '运行中' },
            { label: '停机', val: summary.stopped, color: T.textMuted, filter: '停机' },
            { label: '异常', val: summary.abnormal, color: T.danger, filter: '异常' },
          ].map(s => {
            const active = deviceStatusFilter === s.filter;
            return (
              <div key={s.label}
                onClick={() => setDeviceStatusFilter(s.filter)}
                title={`点击筛选：${s.filter}`}
                style={{
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  padding: '5px 8px', borderRadius: 4, fontSize: 12,
                  borderBottom: `1px solid ${T.borderColor}`,
                  cursor: 'pointer',
                  background: active ? T.activeItemBg : 'transparent',
                }}
              >
                <span style={{ color: active ? T.accent : T.textMuted }}>{s.label}</span>
                <span style={{ fontWeight: 600, color: s.color }}>{s.val}</span>
              </div>
            );
          })}
          {deviceStatusFilter !== '全部' && (
            <button onClick={() => setDeviceStatusFilter('全部')} style={{
              marginTop: 8, width: '100%', padding: '4px',
              background: 'transparent', border: `1px solid ${T.borderColor}`,
              borderRadius: 4, color: T.textMuted, fontSize: 10, cursor: 'pointer',
            }}>清除筛选</button>
          )}
        </div>

        <div style={{
          flex: 1, background: T.cardBg, border: `1px solid ${T.borderColor}`,
          borderRadius: T.radius, padding: 14, display: 'flex', flexDirection: 'column', overflow: 'hidden', minHeight: 0,
        }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary, marginBottom: 8 }}>摄像头列表</div>
          <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 8 }}>
            {areaTags.map(f => (
              <button key={f} onClick={() => setCamListFilter(f)} style={{
                padding: '2px 6px', fontSize: 9, borderRadius: 3, cursor: 'pointer',
                border: `1px solid ${camListFilter === f ? T.accent : T.borderColor}`,
                background: camListFilter === f ? T.accent : 'transparent',
                color: camListFilter === f ? '#fff' : T.textMuted,
              }}>{f}</button>
            ))}
          </div>
          <div style={{ flex: 1, overflow: 'auto', display: 'flex', flexDirection: 'column', gap: 4 }}>
            {filteredListCams.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '30px 0', color: T.textMuted, fontSize: 11 }}>暂无摄像头</div>
            ) : filteredListCams.map(cam => (
              <div key={cam.id}
                onClick={() => setFullscreenCam(cam)}
                style={{
                  display: 'flex', alignItems: 'center', gap: 6, padding: '5px 6px',
                  background: T.surface2, borderRadius: 4, fontSize: 11, cursor: 'pointer',
                }}
                onMouseEnter={e => e.currentTarget.style.background = T.activeItemBg}
                onMouseLeave={e => e.currentTarget.style.background = T.surface2}
              >
                <span style={{
                  width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
                  background: cam.online ? T.success : T.textMuted,
                }}></span>
                <span style={{ flex: 1, color: T.textPrimary, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{cam.name}</span>
                <span style={{ color: T.textMuted, fontSize: 9 }}>{cam.area}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* 中：实时视频 */}
      <div style={{
        flex: 1, minWidth: 0, background: T.cardBg, border: `1px solid ${T.borderColor}`,
        borderRadius: T.radius, display: 'flex', flexDirection: 'column', overflow: 'hidden',
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '10px 14px', borderBottom: `1px solid ${T.borderColor}`, flexShrink: 0, flexWrap: 'wrap', gap: 6,
        }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>
            实时监控 {fullscreenCam && <span style={{ color: T.accent, fontWeight: 400, fontSize: 11 }}>· {fullscreenCam.name}</span>}
          </span>
          <div style={{ display: 'flex', gap: 4, alignItems: 'center', flexWrap: 'wrap' }}>
            {layoutOptions.map(opt => (
              <button key={opt.n} onClick={() => { setLayout(opt.n); setFullscreenCam(null); }} style={{
                padding: '4px 12px', fontSize: 11, borderRadius: 4, cursor: 'pointer',
                border: `1px solid ${layout === opt.n && !fullscreenCam ? T.accent : T.borderColor}`,
                background: layout === opt.n && !fullscreenCam ? T.accent : 'transparent',
                color: layout === opt.n && !fullscreenCam ? '#fff' : T.textMuted,
              }}>{opt.label}</button>
            ))}
            <div style={{ width: 1, height: 18, background: T.borderColor, margin: '0 4px' }}></div>
            <button onClick={handleRefresh} style={{
              padding: '4px 10px', fontSize: 11, borderRadius: 4, cursor: 'pointer',
              border: `1px solid ${T.borderColor}`, background: 'transparent', color: T.textMuted,
              display: 'flex', alignItems: 'center', gap: 4,
            }}>
              <span style={{
                display: 'inline-block',
                animation: refreshing ? 'spin 0.6s linear' : 'none',
              }}>↻</span>
              刷新
            </button>
          </div>
        </div>
        {fullscreenCam ? (
          <div style={{ flex: 1, position: 'relative', padding: 10, minHeight: 0 }}>
            <div style={{ width: '100%', height: '100%', position: 'relative' }}>
              <CameraCell cam={fullscreenCam} theme={T} size="large" fullscreen key={`fs-${refreshTick}`} />
              <button onClick={() => setFullscreenCam(null)} style={{
                position: 'absolute', top: 10, right: 10,
                padding: '5px 12px', fontSize: 11, borderRadius: 4,
                background: 'rgba(0,0,0,0.6)', border: `1px solid ${T.borderColor}`,
                color: '#fff', cursor: 'pointer',
              }}>✕ 退出全屏</button>
            </div>
          </div>
        ) : (
          <div style={{
            flex: 1, padding: 10, overflow: 'auto', opacity: refreshing ? 0.5 : 1,
            transition: 'opacity 0.2s',
            display: 'grid',
            gridTemplateColumns: `repeat(${cols}, 1fr)`,
            gridTemplateRows: `repeat(${rows}, 1fr)`,
            gap: 6,
          }}>
            {displayCams.map(cam => (
              <CameraCell
                key={`${cam.id}-${refreshTick}`}
                cam={cam} theme={T}
                size={layout >= 16 ? 'tiny' : layout >= 8 ? 'small' : 'normal'}
                onClick={() => setFullscreenCam(cam)}
              />
            ))}
          </div>
        )}
      </div>

      {/* 右：设备列表 */}
      <div style={{ width: 260, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 10, overflow: 'hidden' }}>
        <div style={{
          flex: 1, background: T.cardBg, border: `1px solid ${T.borderColor}`,
          borderRadius: T.radius, display: 'flex', flexDirection: 'column', overflow: 'hidden',
        }}>
          <div style={{
            padding: '12px 14px', borderBottom: `1px solid ${T.borderColor}`, flexShrink: 0,
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>设备列表</span>
            {deviceStatusFilter !== '全部' && (
              <span style={{ fontSize: 10, color: T.accent, background: T.activeItemBg, padding: '2px 6px', borderRadius: 3 }}>
                {deviceStatusFilter} ({filteredDevices.length})
              </span>
            )}
          </div>
          <div style={{ flex: 1, overflow: 'auto', padding: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {filteredDevices.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '40px 0', color: T.textMuted, fontSize: 12 }}>无符合条件设备</div>
            ) : filteredDevices.map(dev => (
              <div
                key={dev.id}
                onClick={() => setSelectedDevice(selectedDevice?.id === dev.id ? null : dev)}
                style={{
                  background: selectedDevice?.id === dev.id ? T.activeItemBg : T.surface2,
                  border: `1px solid ${selectedDevice?.id === dev.id ? T.accent : T.borderColor}`,
                  borderRadius: 8, padding: 12, cursor: 'pointer', transition: 'all 0.2s',
                }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>{dev.name}</span>
                  <span style={{
                    fontSize: 9, padding: '2px 6px', borderRadius: 3,
                    border: `1px solid ${dev.status === '运行中' ? T.success : dev.status === '异常' ? T.danger : T.textMuted}`,
                    color: dev.status === '运行中' ? T.success : dev.status === '异常' ? T.danger : T.textMuted,
                  }}>{dev.status}</span>
                </div>
                <div style={{ fontSize: 11, color: T.textMuted, marginBottom: 4 }}>
                  编号：{dev.code} · {dev.type}
                </div>
                <div style={{ fontSize: 10, color: T.textMuted }}>最近上报：{dev.lastReport}</div>
                {dev.note && (
                  <div style={{
                    marginTop: 6, fontSize: 10, color: T.warning,
                    background: `${T.warning}15`, padding: '3px 6px', borderRadius: 3,
                  }}>⚠ {dev.note}</div>
                )}
                {selectedDevice?.id === dev.id && (
                  <div style={{ marginTop: 10, borderTop: `1px solid ${T.borderColor}`, paddingTop: 10 }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                      {[['额定高度', dev.height], ['额定载荷', dev.maxLoad]].map(([k, v]) => (
                        <div key={k} style={{ background: T.cardBg, borderRadius: 4, padding: '6px 8px' }}>
                          <div style={{ fontSize: 9, color: T.textMuted, marginBottom: 2 }}>{k}</div>
                          <div style={{ fontSize: 13, fontWeight: 600, color: T.textPrimary }}>{v}</div>
                        </div>
                      ))}
                    </div>
                    <button onClick={e => handleRefreshDevice(e, dev)} style={{
                      marginTop: 8, width: '100%', padding: '6px',
                      background: T.surface2, border: `1px solid ${T.borderColor}`,
                      borderRadius: 5, color: T.textSecondary, fontSize: 11, cursor: 'pointer',
                    }}>↻ 刷新状态</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── 主应用 ──────────────────────────────────────────
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('app_page') || 'overview');
  const [project, setProject] = React.useState(() => localStorage.getItem('app_project') || 'p1');
  const [themeId, setThemeId] = React.useState(() => localStorage.getItem('app_theme') || 'T1');
  const [compactMode, setCompactMode] = React.useState(() => localStorage.getItem('app_compact') === '1');

  const T = ALL_THEMES.find(t => t.id === themeId) || ALL_THEMES[0];

  const handleThemeChange = (id) => { setThemeId(id); localStorage.setItem('app_theme', id); };
  const handlePageChange = (p) => { setPage(p); localStorage.setItem('app_page', p); };
  const handleProjectChange = (p) => { setProject(p); localStorage.setItem('app_project', p); };
  const handleCompactChange = (v) => { setCompactMode(v); localStorage.setItem('app_compact', v ? '1' : '0'); };

  return (
    <div style={{
      width: '100vw', height: '100vh',
      background: T.pageBg,
      display: 'flex', flexDirection: 'column',
      fontFamily: '"PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif',
      overflow: 'hidden',
      fontSize: compactMode ? '13px' : '14px',
    }}>
      <TopNav
        currentPage={page}
        onPageChange={handlePageChange}
        currentProject={project}
        onProjectChange={handleProjectChange}
        theme={T}
        themeId={themeId}
        onThemeChange={handleThemeChange}
        compactMode={compactMode}
        onCompactChange={handleCompactChange}
      />
      <main style={{ flex: 1, overflow: 'hidden', minHeight: 0 }}>
        {page === 'overview' && <PageOverview project={project} theme={T} />}
        {page === 'personnel' && <PagePersonnel project={project} theme={T} />}
        {page === 'monitor' && <PageMonitor project={project} theme={T} />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
