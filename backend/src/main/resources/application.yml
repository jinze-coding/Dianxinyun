server:
  port: 8080

spring:
  application:
    name: site-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dianxinyun?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:site-platform-development-only-change-me}
  expiration: 3153600000000

knife4j:
  enable: true
  setting:
    language: zh_cn

file:
  upload:
    path: ./uploads
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_BUCKET:site-platform}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}

wechat:
  mini-program:
    app-id: ${WECHAT_MINI_PROGRAM_APP_ID:touristappid}
    app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
    mock-enabled: ${WECHAT_MINI_PROGRAM_MOCK_ENABLED:true}
    page: pages/scan-entry/index
    env-version: ${WECHAT_MINI_PROGRAM_ENV_VERSION:release}
    public-fallback-url: ${WECHAT_MINI_PROGRAM_PUBLIC_FALLBACK_URL:http://localhost:3003/#/pages/scan-entry/index}
  message:
    review-template-id: ${WECHAT_REVIEW_TEMPLATE_ID:}
    rectification-template-id: ${WECHAT_RECTIFICATION_TEMPLATE_ID:}
    recheck-template-id: ${WECHAT_RECHECK_TEMPLATE_ID:}
