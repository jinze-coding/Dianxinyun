server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: site-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dianxinyun?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认禁止输出 SQL 参数，避免密码摘要、手机号等敏感字段进入启动日志。
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:site-platform-development-only-change-me}
  expiration: ${JWT_EXPIRATION_MILLIS:604800000}

knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

file:
  upload:
    path: ./uploads
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_BUCKET:site-platform}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
  cleanup:
    quality-staging:
      enabled: ${QUALITY_STAGING_CLEANUP_ENABLED:true}
      ttl-hours: ${QUALITY_STAGING_CLEANUP_TTL_HOURS:24}
      batch-size: ${QUALITY_STAGING_CLEANUP_BATCH_SIZE:200}
      initial-delay-ms: ${QUALITY_STAGING_CLEANUP_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${QUALITY_STAGING_CLEANUP_FIXED_DELAY_MS:3600000}

wechat:
  mini-program:
    app-id: ${WECHAT_MINI_PROGRAM_APP_ID:touristappid}
    app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
    mock-enabled: ${WECHAT_MINI_PROGRAM_MOCK_ENABLED:false}
    production: ${WECHAT_MINI_PROGRAM_PRODUCTION:false}
    legal-domain: ${WECHAT_MINI_PROGRAM_LEGAL_DOMAIN:}
    connect-timeout-millis: ${WECHAT_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${WECHAT_READ_TIMEOUT_MILLIS:8000}
    page: pages/scan-entry/index
    web-login-page: pages/web-login-confirm/index
    env-version: ${WECHAT_MINI_PROGRAM_ENV_VERSION:release}
    public-fallback-url: ${WECHAT_MINI_PROGRAM_PUBLIC_FALLBACK_URL:http://localhost:3003/#/pages/scan-entry/index}
  message:
    review-template-id: ${WECHAT_REVIEW_TEMPLATE_ID:}
    rectification-template-id: ${WECHAT_RECTIFICATION_TEMPLATE_ID:}
    recheck-template-id: ${WECHAT_RECHECK_TEMPLATE_ID:}
